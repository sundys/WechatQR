name: platform_services
description: "Native device capabilities for WeChatQR: vibration, gallery saving and Android package-install hand-off."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.sundys.platform_services
        pluginClass: PlatformServicesPlugin
      ios:
        pluginClass: PlatformServicesPlugin
