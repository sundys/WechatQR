name: wechat_qrcode
description: "Flutter wrapper around OpenCV's WeChatQRCode detector for Android and iOS."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.sundys.wechat_qrcode
        pluginClass: WeChatQrcodePlugin
      ios:
        pluginClass: WeChatQrcodePlugin
