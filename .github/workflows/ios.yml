name: iOS build (manual)

# Produces the TrollStore .ipa.
#
# This is a manual workflow on purpose. Building OpenCV for iOS takes tens of
# minutes on a cold cache, and iOS is not covered by the Android release path,
# so the .ipa is built when it is wanted rather than on every release.
#
# Run it from Actions > "iOS build (manual)" > Run workflow. Set
# `attach_to_release` to an existing release tag (for example `v1.0.2`) to
# attach the .ipa to that release. Leaving it empty still builds and verifies
# the .ipa, but publishes nothing: the release page is the only place artifacts
# are published, so there is deliberately no workflow artifact to collect.

on:
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: 'Release tag to attach the .ipa to (empty = build only, publishes nothing)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.5'
  OPENCV_VERSION: '4.12.0'

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      name: ${{ steps.read.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      # Checked here, in the cheap job, rather than at the end of the macOS one.
      # A bad tag would otherwise surface only after the OpenCV framework and the
      # whole app had been built: minutes of runner time lost to a typo in the
      # input, with nothing published at the end of it either way.
      - name: Validate the release tag input
        if: inputs.attach_to_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.attach_to_release }}'
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "::error::attach_to_release must be a release tag such as v1.0.2, but was '$tag'. Leave it empty to build and verify the .ipa without publishing it."
            exit 1
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::No release named '$tag' exists. Push the matching tag first, or leave attach_to_release empty."
            exit 1
          fi
          echo "The .ipa will be attached to release $tag."
      - name: Read the version from pubspec.yaml
        id: read
        run: |
          set -euo pipefail
          name=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' app/pubspec.yaml | head -1)
          if [ -z "$name" ]; then
            echo "::error::Could not read the version from app/pubspec.yaml"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version: $name"

  ios:
    name: iOS IPA (TrollStore)
    needs: version
    runs-on: macos-14
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Building OpenCV for iOS takes about twenty minutes, so the result is
      # cached and only rebuilt when OPENCV_VERSION changes.
      - name: Restore the OpenCV xcframework
        id: opencv-cache
        uses: actions/cache/restore@v5
        with:
          path: packages/wechat_qrcode/ios/wechat_qrcode/opencv2.xcframework
          key: opencv-ios-${{ env.OPENCV_VERSION }}-${{ runner.arch }}-v5

      - name: Build the OpenCV xcframework
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        timeout-minutes: 240
        env:
          OPENCV_VERSION: ${{ env.OPENCV_VERSION }}
        # Invoked through bash rather than as ./scripts/... so the step cannot
        # fail on a missing executable bit. The bit is set in the index too, but
        # this costs nothing and removes the class of failure entirely.
        run: bash scripts/build_opencv_ios.sh

      # Saved explicitly, as soon as the framework exists, instead of relying on
      # the restore step's post action. actions/cache does not write its entry
      # when the job fails, so a failure later in this job — in the app build,
      # say — would discard twenty minutes of OpenCV compilation and make the
      # next attempt pay for it again.
      #
      # No `always()`: if the build step failed there is nothing worth caching,
      # and this way a broken framework can never enter the cache.
      - name: Save the OpenCV xcframework
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: packages/wechat_qrcode/ios/wechat_qrcode/opencv2.xcframework
          key: opencv-ios-${{ env.OPENCV_VERSION }}-${{ runner.arch }}-v5

      - name: Confirm the framework is present
        run: |
          set -euo pipefail
          test -d packages/wechat_qrcode/ios/wechat_qrcode/opencv2.xcframework \
            || { echo "::error::opencv2.xcframework is missing; the plugin cannot link."; exit 1; }

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      # No codesigning: the .ipa produced here is meant for TrollStore, which
      # applies its own signing on the device. There is no App Store or normal
      # signing path for this artifact.
      - name: Build the app
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package the .ipa
        working-directory: app
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.name }}'
          app_path="build/ios/iphoneos/Runner.app"
          test -d "$app_path" || { echo "::error::$app_path was not produced."; exit 1; }

          # The CNN models must be inside the bundle, or the engine cannot start
          # on device. Checked here so a packaging regression fails the build.
          find "$app_path" -name 'detect.prototxt' -print
          find "$app_path" -name 'detect.prototxt' | grep -q . \
            || { echo "::error::The QR models are not inside the app bundle."; exit 1; }

          out="$GITHUB_WORKSPACE/wechatqr-${version}.ipa"
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$out" Payload)
          echo "Built $out ($(stat -f%z "$out") bytes)."

      - name: Note that nothing was published
        if: inputs.attach_to_release == ''
        run: |
          echo "::notice title=Nothing published::The .ipa was built and verified, but attach_to_release was empty. Re-run with a release tag (for example v1.0.2) to attach it to that release. There is no workflow artifact to download by design — the release page is where artifacts live."

      - name: Attach the .ipa to a release
        if: inputs.attach_to_release != ''
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.attach_to_release }}'
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null \
            || { echo "::error::No release named '$tag' exists. Push the matching tag first, or leave attach_to_release empty to build without publishing."; exit 1; }
          gh release upload "$tag" wechatqr-*.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
