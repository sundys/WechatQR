name: Release

# Pushing a `v*` tag builds the Android APK and publishes a GitHub Release
# containing it.
#
# iOS is deliberately NOT part of this workflow: building OpenCV for iOS takes
# tens of minutes and would hold up every release. The .ipa is produced by
# `ios.yml`, which is run by hand and can attach its output to an existing
# release.
#
# Android signing comes from repository secrets; a tag build refuses to run
# without them so a debug-signed APK can never be published by accident.
#
# No workflow artifacts are produced: the release page is the single place a
# downloadable build lives, so a manual run publishes nothing by design.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.5'
  JAVA_VERSION: '17'

jobs:
  # Resolves the version once so the artifact names and the tag check agree.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      name: ${{ steps.read.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - name: Read the version from pubspec.yaml
        id: read
        run: |
          set -euo pipefail
          # `version: 1.0.0+1` -> `1.0.0`
          name=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' app/pubspec.yaml | head -1)
          if [ -z "$name" ]; then
            echo "::error::Could not read the version from app/pubspec.yaml"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version: $name"

      - name: Check the tag matches the pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version='${{ steps.read.outputs.name }}'
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match the version $version in app/pubspec.yaml. Bump the version, commit, then re-tag."
            exit 1
          fi

  android:
    name: Android APK (arm64-v8a)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Job-level so the `if` below can test it: the secrets context itself is
      # not available in step conditions.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Test
        working-directory: app
        run: flutter test

      - name: Require the signing configuration for a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$ANDROID_KEYSTORE_BASE64" ]   || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ANDROID_KEY_ALIAS" ]         || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$ANDROID_KEY_PASSWORD" ]      || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets are not set:$missing. Configure them under Settings > Secrets and variables > Actions, then re-run this workflow; publishing an APK signed with the debug key would be a liability."
            exit 1
          fi
          echo "Signing secrets are present."

      - name: Write the signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Size only: never echo the contents.
          echo "Keystore written: $(stat -c%s "$RUNNER_TEMP/release.jks") bytes."

      - name: Build the release APK
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # arm64-v8a only: the ABI libopencv_java4.so is shipped for. The release
        # build type clears abiFilters to the same value, so this is belt and
        # braces against an accidental fat build.
        run: flutter build apk --release --target-platform android-arm64

      - name: Name the artifact and verify its contents
        working-directory: app
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.name }}'
          out="wechatqr-${version}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$out"

          # An APK carrying another ABI would install and then fail at runtime,
          # so the packaging is checked rather than assumed.
          if unzip -l "$out" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "::error::$out contains an ABI the engine does not support."
            exit 1
          fi
          unzip -l "$out" | grep -q 'lib/arm64-v8a/libopencv_java4.so' \
            || { echo "::error::libopencv_java4.so is missing from $out"; exit 1; }
          for model in detect.caffemodel detect.prototxt sr.caffemodel sr.prototxt; do
            unzip -l "$out" | grep -q "assets/models/$model" \
              || { echo "::error::QR model $model is missing from $out"; exit 1; }
          done

          # The permission list of a release artifact is not visible to any test:
          # Flutter declares INTERNET only in the debug and profile manifests, so a
          # release build silently ships without it and every request fails before it
          # leaves the device. That shipped once; this is what notices next time.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          aapt2=$(ls -1 "$sdk"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [[ -z "$aapt2" ]]; then
            echo "::warning::aapt2 was not found, so the INTERNET permission went unchecked."
          else
            if "$aapt2" dump permissions "$out" | grep -q "android.permission.INTERNET"; then
              echo "INTERNET permission verified."
            else
              echo "::error::$out does not declare android.permission.INTERNET, so every network call in this build - the update check included - would fail."
              exit 1
            fi
          fi

          echo "Built $out ($(stat -c%s "$out") bytes)."

      # Publishing happens here rather than in a separate job so that the APK
      # never has to travel through a workflow artifact. Artifacts are not used
      # at all: everything downloadable lives on the release page.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # A curated summary is used when one has been written for this tag;
          # otherwise GitHub's generated changelog stands in, which is a list
          # of commits rather than something a user can read.
          notes="../docs/releases/${tag}.md"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-running a tag replaces what is published instead of failing, so
            # a release can be corrected without inventing a version number. The
            # asset keeps its name, so --clobber overwrites it in place.
            echo "Release $tag exists; updating it in place."
            if [[ -f "$notes" ]]; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            fi
            gh release upload "$tag" wechatqr-*.apk --repo "$GITHUB_REPOSITORY" --clobber
          elif [[ -f "$notes" ]]; then
            echo "Creating $tag with the curated notes at $notes"
            # The .ipa is attached later by the manual "iOS build" workflow.
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes" wechatqr-*.apk
          else
            echo "Creating $tag with generated notes; no curated notes at $notes"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --generate-notes wechatqr-*.apk
          fi

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
